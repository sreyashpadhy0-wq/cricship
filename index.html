<!DOCTYPE html>
<html>
<head>
    <title>Cricship</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1e3f;
            color: white;
        }

        nav {
            background: #111;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav h1 {
            margin: 0;
            color: #1e90ff;
        }

        .hero {
            padding: 60px;
            text-align: center;
            background: linear-gradient(to right, #1e90ff, #0b1e3f);
        }

        .container {
            padding: 20px;
        }

        .card {
            background: #162447;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .match-card {
            background: #162447;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #1e90ff;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #111;
        }
    </style>
</head>

<body>

<nav>
    <h1>🏏 Cricship</h1>
</nav>

<div class="hero">
    <h2>Welcome to Cricship</h2>
    <p>Cricket. Passion. Analysis.</p>
</div>

<div class="container">
    <h2>🏏 Matches</h2>
    <div id="matches">Loading matches...</div>
</div>
<div class="container">
    <h2>🏏 Live Cricket</h2>

    <div class="card">
        <p>👉 Click below to view real live cricket matches:</p>

        <a href="https://www.cricbuzz.com/cricket-match/live-scores" target="_blank" 
        style="color:#1e90ff; font-size:18px;">
            🔴 View Live Scores on Cricbuzz
        </a>
    </div>
</div>

<footer>
    © 2026 Cricship | Made by Shreyas 🚀
</footer>

</body>
</html>
