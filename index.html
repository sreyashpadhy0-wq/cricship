<!DOCTYPE html>
<html>
<head>
    <title>Cricship</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1e3f;
            color: white;
        }

        nav {
            background: #111;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav h1 {
            margin: 0;
            color: #1e90ff;
        }

        .hero {
            padding: 60px;
            text-align: center;
            background: linear-gradient(to right, #1e90ff, #0b1e3f);
        }

        .container {
            padding: 20px;
        }

        .card {
            background: #162447;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .match-card {
            background: #162447;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #1e90ff;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #111;
        }
    </style>
</head>

<body>

<nav>
    <h1>🏏 Cricship</h1>
</nav>

<div class="hero">
    <h2>Welcome to Cricship</h2>
    <p>Cricket. Passion. Analysis.</p>
</div>

<div class="container">
    <h2>🏏 Matches</h2>
    <div id="matches">Loading matches...</div>
</div>

<script>
async function getMatches() {
    const apiKey = "ad3b94c2-6be0-465f-bc2a-89c949eb8594";

    try {
        const response = await fetch(
            "https://api.allorigins.win/get?url=" +
            encodeURIComponent("https://api.cricketdata.org/v1/matches?apikey=" + apiKey)
        );

        const result = await response.json();
        const data = JSON.parse(result.contents);

        let output = "";

        if (!data.data || data.data.length === 0) {
            output = "<p>No matches available right now.</p>";
        } else {
            data.data.slice(0, 5).forEach(match => {

                let badge = "";

                if (match.status && match.status.toLowerCase().includes("live")) {
                    badge = "<span style='color:#00ffcc;'>● LIVE</span>";
                } else if (match.status && match.status.toLowerCase().includes("upcoming")) {
                    badge = "<span style='color:orange;'>● UPCOMING</span>";
                } else {
                    badge = "<span style='color:gray;'>● " + match.status + "</span>";
                }

                let teams = match.teams ? match.teams.join(" vs ") : "Teams not available";

                output +=
                    "<div class='match-card'>" +
                    "<h3>" + match.name + "</h3>" +
                    "<p><strong>Teams:</strong> " + teams + "</p>" +
                    "<p>" + badge + "</p>" +
                    "</div>";
            });
        }

        document.getElementById("matches").innerHTML = output;

    } catch (error) {
        document.getElementById("matches").innerHTML = "<p>Error loading matches.</p>";
    }
}

/* Load once */
getMatches();

/* Auto refresh every 30 sec */
setInterval(getMatches, 30000);
</script>

<footer>
    © 2026 Cricship | Made by Shreyas 🚀
</footer>

</body>
</html>
