<!DOCTYPE html>
<html>
<head>
    <title>Cricship</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1e3f;
            color: white;
        }

        nav {
            background: #111;
            padding: 15px;
        }

        nav h1 {
            margin: 0;
            color: #1e90ff;
        }

        .hero {
            padding: 50px;
            text-align: center;
            background: linear-gradient(to right, #1e90ff, #0b1e3f);
        }

        .container {
            padding: 20px;
        }

        .card {
            background: #162447;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }

        button {
            background: #1e90ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<nav>
    <h1>🏏 Cricship</h1>
</nav>

<div class="hero">
    <h2>Welcome to Cricship</h2>
</div>

<!-- LIVE LINK -->
<div class="container">
    <h2>🔴 Live Cricket</h2>

    <div class="card">
        <button onclick="window.open('https://www.cricbuzz.com/cricket-match/live-scores')">
            Watch Live Matches
        </button>
    </div>
</div>

<!-- WRITE POST -->
<div class="container">
    <h2>✍️ Write Your Article</h2>

    <input id="title" placeholder="Enter title">
    <textarea id="content" placeholder="Write your article"></textarea>

    <button onclick="addPost()">Post</button>
</div>

<!-- SHOW POSTS -->
<div class="container">
    <h2>📰 Your Posts</h2>
    <div id="posts"></div>
</div>

<script>
function addPost() {
    let title = document.getElementById("title").value;
    let content = document.getElementById("content").value;

    if (title === "" || content === "") {
        alert("Fill all fields");
        return;
    }

    let post = "<div class='card'><h3>" + title + "</h3><p>" + content + "</p></div>";

    document.getElementById("posts").innerHTML += post;

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
}
</script>

</body>
</html>
